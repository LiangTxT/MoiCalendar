name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Test
        run: dotnet test MoiCalendar.slnx --configuration Release
      - name: Generate production browser configuration
        env:
          MOICALENDAR_PUBLIC_BASE_URL: ${{ vars.MOICALENDAR_PUBLIC_BASE_URL }}
          MOICALENDAR_CLOUD_ENABLED: ${{ vars.MOICALENDAR_CLOUD_ENABLED }}
          MOICALENDAR_CLOUD_BASE_URL: ${{ vars.MOICALENDAR_CLOUD_BASE_URL }}
          MOICALENDAR_CLOUD_PUBLIC_KEY: ${{ vars.MOICALENDAR_CLOUD_PUBLIC_KEY }}
          MOICALENDAR_SUPABASE_REALTIME_PATH: ${{ vars.MOICALENDAR_SUPABASE_REALTIME_PATH }}
        run: npm run cloud:configure:production
      - name: Publish
        run: dotnet publish src/MoiCalendar.App/MoiCalendar.App.csproj --configuration Release --no-restore
      - name: Apply production browser security headers
        run: npm run deploy:harden
      - name: Validate production static output
        run: npm run deploy:validate
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_ROCK_09EDDAF00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "src/MoiCalendar.App/bin/Release/net10.0/publish/wwwroot" # Prebuilt static output
          api_location: "" # Api source code path - optional
          output_location: ""
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_ROCK_09EDDAF00 }}
          action: "close"
